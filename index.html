
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b14">
<title>Otaku Box | Anime Universe</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#090b14;--panel:#121625;--muted:#9ba3b8;--accent:#a78bfa}
body{background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{height:72px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:#0d1020;border-bottom:1px solid #252a40;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--accent)}
.tag{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:4px}
nav{display:flex;gap:22px}
nav a{color:#c4c9d8;text-decoration:none;font-size:14px}
nav a:hover{color:var(--accent)}
.wrap{max-width:1400px;margin:auto;padding:28px 6% 60px}
.hero{min-height:340px;border:1px solid #343052;border-radius:24px;overflow:hidden;position:relative;display:flex;align-items:center;padding:40px;background:linear-gradient(90deg,#15152a 0%,#19172edb 48%,#211d3a88 100%),url('https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1400&q=85') center/cover}
.hero-content{max-width:570px;position:relative}
.eyebrow{color:#c4b5fd;font-size:12px;font-weight:bold;letter-spacing:3px;margin-bottom:18px}
.hero h1{font-size:clamp(38px,6vw,68px);line-height:1.02;letter-spacing:-2px;margin-bottom:16px}
.hero h1 span{color:#c4b5fd}
.hero p{color:#d0d2e0;line-height:1.7;max-width:470px;font-size:14px}
.hero-actions{display:flex;gap:12px;margin-top:25px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:13px 19px;font-weight:bold;cursor:pointer}
.primary{background:#a78bfa;color:#100b20}
.secondary{background:#ffffff14;color:white;border:1px solid #ffffff30}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:38px 0 18px}
.section-head h2{font-size:24px}
.section-head p{font-size:12px;color:var(--muted);margin-top:7px}
.search{width:100%;max-width:300px;background:#121625;border:1px solid #2a3047;color:white;border-radius:10px;padding:13px;outline:none}
.search:focus{border-color:var(--accent)}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}
.filter{background:#121625;border:1px solid #282e44;color:#c5cada;border-radius:20px;padding:9px 15px;cursor:pointer}
.filter.active,.filter:hover{background:#a78bfa;color:#100b20;border-color:#a78bfa}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{background:var(--panel);border:1px solid #242a40;border-radius:16px;overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-5px);border-color:#8b7bd1}
.poster{height:210px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#30265b,#111a33)}
.poster img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.poster .emoji{font-size:65px;filter:drop-shadow(0 5px 15px #0008)}
.tag-pill{position:absolute;top:12px;left:12px;background:#090b14d9;padding:6px 9px;border-radius:7px;font-size:10px;letter-spacing:1px}
.card-body{padding:16px}
.card-title{font-size:17px;font-weight:bold;margin-bottom:8px}
.meta{color:var(--muted);font-size:12px;margin-bottom:15px}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.score{color:#f5cc78;font-size:12px}
.save{background:#252b42;color:#fff;border:0;border-radius:8px;padding:9px 11px;cursor:pointer}
.save.saved{background:#a78bfa;color:#100b20}
.empty{grid-column:1/-1;padding:35px;text-align:center;color:var(--muted);background:var(--panel);border-radius:14px}
footer{text-align:center;border-top:1px solid #252a40;padding:25px;color:var(--muted);font-size:12px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){
 header{padding:0 5%;height:65px}nav{gap:12px}nav a{font-size:12px}
 .wrap{padding:20px 5% 40px}.hero{padding:26px;min-height:330px;background-position:60% center}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .poster{height:155px}.card-body{padding:12px}.card-title{font-size:14px}
 .section-head{align-items:stretch;flex-direction:column}.search{max-width:none}
}
@media(max-width:390px){nav a:nth-child(2){display:none}.grid{grid-template-columns:1fr}.poster{height:200px}}
</style>
</head>

<body>
<header>
  <div>
    <div class="logo">OTAKU <span>BOX.</span></div>
    <div class="tag">YOUR ANIME UNIVERSE</div>
  </div>
  <nav>
    <a href="#home">Home</a>
    <a href="#anime">Explore</a>
    <a href="#watchlist">Watchlist <span id="saved-count">0</span></a>
  </nav>
</header>

<main class="wrap">
  <section class="hero" id="home">
    <div class="hero-content">
      <div class="eyebrow">✦ THE ANIME EXPERIENCE</div>
      <h1>Your next<br>obsession <span>awaits.</span></h1>
      <p>Discover anime worlds, explore new adventures, and keep your favourite shows in one place.</p>
      <div class="hero-actions">
        <button class="btn primary" onclick="document.getElementById('anime').scrollIntoView({behavior:'smooth'})">Explore Anime ↗</button>
        <button class="btn secondary" onclick="showWatchlist()">♡ My Watchlist</button>
      </div>
    </div>
  </section>

  <section id="anime">
    <div class="section-head">
      <div>
        <h2 id="list-title">Explore Anime</h2>
        <p>Find your next favourite series.</p>
      </div>
      <input class="search" id="search" type="search" placeholder="⌕  Search anime..." aria-label="Search anime">
    </div>
    <div class="filters" id="filters">
      <button class="filter active" data-genre="All">All Anime</button>
      <button class="filter" data-genre="Action">Action</button>
      <button class="filter" data-genre="Fantasy">Fantasy</button>
      <button class="filter" data-genre="Romance">Romance</button>
      <button class="filter" data-genre="Sports">Sports</button>
    </div>
    <div class="grid" id="anime-grid"></div>
  </section>
</main>

<footer>OTAKU BOX © 2026 · Made for anime fans ✦</footer>

<script>
const animeList=[
 {id:1,title:"Demon Slayer",genre:"Action",year:"2019",rating:"9.0",emoji:"⚔️",color:"#542c47"},
 {id:2,title:"Your Name",genre:"Romance",year:"2016",rating:"8.9",emoji:"🌌",color:"#24446b"},
 {id:3,title:"Solo Leveling",genre:"Fantasy",year:"2024",rating:"8.7",emoji:"🌑",color:"#24284d"},
 {id:4,title:"Naruto",genre:"Action",year:"2002",rating:"8.4",emoji:"🍥",color:"#74462a"},
 {id:5,title:"Haikyu!!",genre:"Sports",year:"2014",rating:"8.7",emoji:"🏐",color:"#75472c"},
 {id:6,title:"Re:Zero",genre:"Fantasy",year:"2016",rating:"8.1",emoji:"❄️",color:"#293e63"},
 {id:7,title:"Weathering With You",genre:"Romance",year:"2019",rating:"8.2",emoji:"🌧️",color:"#345d7b"},
 {id:8,title:"Jujutsu Kaisen",genre:"Action",year:"2020",rating:"8.6",emoji:"👊",color:"#38274e"}
];
let activeGenre="All";
let watchlist=JSON.parse(localStorage.getItem("otaku-watchlist")||"[]");
let watchlistMode=false;

function render(){
 const query=document.getElementById("search").value.toLowerCase().trim();
 const items=animeList.filter(a=>(activeGenre==="All"||a.genre===activeGenre)&&a.title.toLowerCase().includes(query)&&( !watchlistMode||watchlist.includes(a.id)));
 document.getElementById("list-title").textContent=watchlistMode?"♡ My Watchlist":"Explore Anime";
 document.getElementById("filters").style.display=watchlistMode?"none":"flex";
 document.getElementById("saved-count").textContent=watchlist.length;
 const grid=document.getElementById("anime-grid");
 if(!items.length){grid.innerHTML='<div class="empty">No anime found. Try another search!</div>';return;}
 grid.innerHTML=items.map(a=>`
 <article class="card">
  <div class="poster" style="background:linear-gradient(135deg,${a.color},#111526)">
   <span class="emoji">${a.emoji}</span>
   <span class="tag-pill">${a.genre.toUpperCase()}</span>
  </div>
  <div class="card-body">
   <div class="card-title">${a.title}</div>
   <div class="meta">${a.year} · Anime · ${a.genre}</div>
   <div class="card-bottom">
    <span class="score">★ ${a.rating}</span>
    <button class="save ${watchlist.includes(a.id)?"saved":""}" onclick="toggleSave(${a.id})">${watchlist.includes(a.id)?"✓ Saved":"+ Watchlist"}</button>
   </div>
  </div>
 </article>`).join("");
}
function toggleSave(id){
 watchlist=watchlist.includes(id)?watchlist.filter(x=>x!==id):[...watchlist,id];
 localStorage.setItem("otaku-watchlist",JSON.stringify(watchlist));render();
}
function showWatchlist(){
 watchlistMode=!watchlistMode;activeGenre="All";
 document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.genre==="All"));
 document.getElementById("search").value="";
 render();document.getElementById("anime").scrollIntoView({behavior:"smooth"});
}
document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{
 activeGenre=btn.dataset.genre;watchlistMode=false;
 document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b===btn));render();
}));
document.getElementById("search").addEventListener("input",()=>{watchlistMode=false;render()});
render();
</script>
</body>
</html>
