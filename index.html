
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090911">
<title>Otaku Box — Anime Universe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090911;color:#f7f5ff;font-family:Arial,sans-serif}
header{height:76px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:#10101b;border-bottom:1px solid #29243c}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}
.logo span{color:#b69aff}
nav{display:flex;gap:22px}
nav a{color:#c5bfd7;text-decoration:none;font-size:14px}
main{max-width:1250px;margin:auto;padding:30px 6% 60px}
.hero{min-height:350px;padding:40px;display:flex;align-items:center;border-radius:24px;border:1px solid #40305c;background:radial-gradient(ellipse at 85% 25%,#6942a755,transparent 40%),linear-gradient(120deg,#21162f,#11111e 70%);overflow:hidden}
.hero-content{max-width:580px}
.tag{color:#c4a7ff;font-size:12px;letter-spacing:3px;font-weight:bold;margin-bottom:18px}
h1{font-size:clamp(40px,6vw,70px);line-height:1.02;letter-spacing:-2px;margin-bottom:18px}
h1 span{color:#c3a4ff}
.hero p{color:#c4bfd2;font-size:15px;line-height:1.8;max-width:450px}
button{cursor:pointer;font-weight:bold}
.primary{background:#b69aff;color:#151020;border:0;padding:14px 20px;border-radius:10px;margin-top:23px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:38px 0 20px}
.heading h2{font-size:25px}
.heading p{color:#9994aa;font-size:13px;margin-top:7px}
input{background:#151522;color:white;border:1px solid #343047;padding:13px 15px;border-radius:10px;width:260px;max-width:100%;outline:none}
input:focus{border-color:#b69aff}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}
.filter{background:#151522;border:1px solid #343047;color:#d3cde1;border-radius:30px;padding:10px 16px}
.filter.active{background:#b69aff;color:#171020;border-color:#b69aff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{background:#141420;border:1px solid #29283a;border-radius:16px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-5px);border-color:#9473d5}
.poster{height:190px;display:flex;align-items:center;justify-content:center;font-size:65px;background:linear-gradient(145deg,var(--c),#10101c)}
.info{padding:15px}
.title{font-size:16px;font-weight:bold;margin-bottom:9px}
.meta{color:#9f9aaf;font-size:12px;margin-bottom:15px}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rating{font-size:12px;color:#f5cf7a}
.save{border:1px solid #49415f;background:#211c30;color:#e4d8ff;padding:9px;border-radius:8px;font-size:11px}
.save.saved{background:#b69aff;color:#151020}
.empty{grid-column:1/-1;padding:30px;text-align:center;color:#aaa}
footer{text-align:center;border-top:1px solid #29243c;padding:25px;color:#89839a;font-size:12px}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){header{padding:0 5%;height:66px}nav{gap:12px}nav a{font-size:12px}main{padding:20px 5% 40px}.hero{padding:25px;min-height:330px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.poster{height:150px}.info{padding:11px}.title{font-size:14px}.heading{align-items:stretch;flex-direction:column}input{width:100%}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.poster{height:190px}}
</style>
</head>
<body>
<header>
  <div class="logo">OTAKU <span>BOX.</span></div>
  <nav>
    <a href="#home">Home</a>
    <a href="#anime">Explore</a>
    <a href="#watchlist">♡ Watchlist <span id="count">0</span></a>
  </nav>
</header>
<main>
<section class="hero" id="home">
  <div class="hero-content">
    <div class="tag">✦ YOUR ANIME UNIVERSE</div>
    <h1>Enter a world<br>of <span>Anime.</span></h1>
    <p>Discover your next obsession. Explore unforgettable stories and build your personal anime watchlist.</p>
    <button class="primary" onclick="document.getElementById('anime').scrollIntoView({behavior:'smooth'})">Explore Anime ↗</button>
  </div>
</section>
<section id="anime">
  <div class="heading">
    <div><h2 id="heading">Trending Anime</h2><p>Find your next favourite adventure.</p></div>
    <input id="search" type="search" placeholder="⌕  Search anime...">
  </div>
  <div class="filters" id="filters">
    <button class="filter active" data-g="All">All Anime</button>
    <button class="filter" data-g="Action">Action</button>
    <button class="filter" data-g="Fantasy">Fantasy</button>
    <button class="filter" data-g="Romance">Romance</button>
    <button class="filter" data-g="Sports">Sports</button>
  </div>
  <div class="grid" id="grid"></div>
</section>
</main>
<footer>OTAKU BOX © 2026 · MADE FOR ANIME FANS ✦</footer>
<script>
const anime=[
{id:1,n:"Demon Slayer",g:"Action",y:2019,r:"9.0",e:"⚔️",c:"#69334f"},
{id:2,n:"Your Name",g:"Romance",y:2016,r:"8.9",e:"🌌",c:"#345b88"},
{id:3,n:"Solo Leveling",g:"Fantasy",y:2024,r:"8.7",e:"🌑",c:"#39315f"},
{id:4,n:"Naruto",g:"Action",y:2002,r:"8.4",e:"🍥",c:"#8c532c"},
{id:5,n:"Haikyu!!",g:"Sports",y:2014,r:"8.7",e:"🏐",c:"#a65c27"},
{id:6,n:"Re:Zero",g:"Fantasy",y:2016,r:"8.1",e:"❄️",c:"#31587a"},
{id:7,n:"Weathering With You",g:"Romance",y:2019,r:"8.2",e:"🌧️",c:"#36718b"},
{id:8,n:"Jujutsu Kaisen",g:"Action",y:2020,r:"8.6",e:"👊",c:"#583e77"}
];
let genre="All",saved=[];
try{saved=JSON.parse(localStorage.getItem("otaku-saved")||"[]")}catch(e){saved=[]}
let onlySaved=false;
function render(){
const q=document.getElementById("search").value.toLowerCase().trim();
const list=anime.filter(a=>(genre==="All"||a.g===genre)&&a.n.toLowerCase().includes(q)&&(!onlySaved||saved.includes(a.id)));
document.getElementById("heading").textContent=onlySaved?"My Watchlist":"Trending Anime";
document.getElementById("filters").style.display=onlySaved?"none":"flex";
document.getElementById("count").textContent=saved.length;
document.getElementById("grid").innerHTML=list.length?list.map(a=>`
<article class="card">
<div class="poster" style="--c:${a.c}">${a.e}</div>
<div class="info">
<div class="title">${a.n}</div>
<div class="meta">${a.y} · ${a.g}</div>
<div class="bottom"><span class="rating">★ ${a.r}</span>
<button class="save ${saved.includes(a.id)?"saved":""}" onclick="toggle(${a.id})">${saved.includes(a.id)?"✓ Saved":"+ Watchlist"}</button></div>
</div></article>`).join(""):'<div class="empty">No anime found. Try another search!</div>';
}
function toggle(id){
saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];
localStorage.setItem("otaku-saved",JSON.stringify(saved));render();
}
document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{
genre=b.dataset.g;onlySaved=false;
document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render();
}));
document.getElementById("search").addEventListener("input",()=>{onlySaved=false;render()});
document.querySelector('a[href="#watchlist"]').addEventListener("click",e=>{
e.preventDefault();onlySaved=!onlySaved;genre="All";
document.getElementById("search").value="";
document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.g==="All"));render();
document.getElementById("anime").scrollIntoView({behavior:"smooth"});
});
render();
</script>
</body>
</html>
