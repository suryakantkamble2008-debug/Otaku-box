```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090914">
  <title>Otaku Box</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #090914;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px 6%;
      background: #111120;
      border-bottom: 1px solid #302847;
      font-size: 25px;
      font-weight: bold;
    }

    header span { color: #a78bfa; }

    .hero {
      margin: 24px auto;
      width: 90%;
      padding: 35px 22px;
      border-radius: 18px;
      background: linear-gradient(135deg, #382067, #103b50, #111120);
    }

    .hero small { color: #67e8f9; letter-spacing: 3px; }

    h1 { font-size: 42px; margin-bottom: 12px; }

    .hero p { color: #dedced; line-height: 1.6; }

    input {
      display: block;
      width: 90%;
      margin: 24px auto;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #38334e;
      background: #171728;
      color: white;
      font-size: 16px;
    }

    h2 { margin: 28px 5% 16px; }

    #animeList {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 0 5%;
    }

    .card {
      padding: 16px;
      background: #171728;
      border: 1px solid #302847;
      border-radius: 14px;
    }

    .poster {
      height: 95px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #32204e, #123b4c);
      border-radius: 10px;
      font-size: 38px;
    }

    .card p { color: #b9b6cf; font-size: 13px; }

    button {
      border: 0;
      padding: 10px;
      border-radius: 8px;
      background: #7c3aed;
      color: white;
      cursor: pointer;
    }

    nav {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
      padding: 18px 5px;
      background: #111120;
    }

    nav button { background: transparent; color: #c4b5fd; }

    footer {
      padding: 24px;
      text-align: center;
      color: #9994b5;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>🍥 OTAKU <span>BOX</span></header>

  <section class="hero">
    <small>YOUR ANIME UNIVERSE</small>
    <h1>Enter the<br>Anime World.</h1>
    <p>Discover your next adventure and create your anime watchlist.</p>
  </section>

  <input id="search" placeholder="🔎 Search anime..." aria-label="Search anime">

  <h2 id="heading">✨ Explore Anime</h2>
  <div id="animeList"></div>

  <nav>
    <button onclick="home()">🏠 Home</button>
    <button onclick="explore()">🍥 Explore</button>
    <button onclick="saved()">💜 Watchlist</button>
  </nav>

  <footer>OTAKU BOX · YOUR ANIME JOURNEY STARTS HERE</footer>

  <script>
    const anime = [
      { name: "Naruto", genre: "Action · Adventure", icon: "🍥" },
      { name: "Demon Slayer", genre: "Action · Fantasy", icon: "⚔️" },
      { name: "Solo Leveling", genre: "Action · Fantasy", icon: "🌑" },
      { name: "Your Name", genre: "Romance · Fantasy", icon: "🌌" },
      { name: "Haikyu!!", genre: "Sports · Comedy", icon: "🏐" },
      { name: "Re:Zero", genre: "Fantasy · Drama", icon: "⏳" }
    ];

    let watchlist = JSON.parse(localStorage.getItem("otakuSaved") || "[]");
    let mode = "all";

    function render() {
      const query = document.getElementById("search").value.toLowerCase();

      const filtered = anime.filter(a =>
        (a.name.toLowerCase().includes(query) ||
         a.genre.toLowerCase().includes(query)) &&
        (mode !== "saved" || watchlist.includes(a.name))
      );

      document.getElementById("heading").textContent =
        mode === "saved" ? "💜 My Watchlist" : "✨ Explore Anime";

      document.getElementById("animeList").innerHTML = filtered.map(a => `
        <div class="card">
          <div class="poster">${a.icon}</div>
          <h3>${a.name}</h3>
          <p>${a.genre}</p>
          <button onclick="toggleSave('${a.name}')">
            ${watchlist.includes(a.name) ? "✓ Saved" : "+ Watchlist"}
          </button>
        </div>
      `).join("") || "<p>No anime found.</p>";
    }

    function toggleSave(name) {
      watchlist = watchlist.includes(name)
        ? watchlist.filter(x => x !== name)
        : [...watchlist, name];

      localStorage.setItem("otakuSaved", JSON.stringify(watchlist));
      render();
    }

    function home() {
      mode = "all";
      document.getElementById("search").value = "";
      render();
    }

    function explore() {
      mode = "all";
      render();
    }

    function saved() {
      mode = "saved";
      render();
    }

    document.getElementById("search").addEventListener("input", render);
    render();
  </script>
</body>
</html>
